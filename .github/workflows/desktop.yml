# 데스크톱 앱 설치 파일 빌드(Windows·macOS·Linux). 수동 실행(Actions 탭 → Desktop build → Run workflow) 또는 v* 태그를 올리면 실행된다.
# 결과물은 실행 화면의 Artifacts 에서 받는다. 서명하지 않은 빌드다(docs/desktop.md 참고).
name: Desktop build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: photo-reel-studio-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
